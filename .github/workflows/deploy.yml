name: Deploy Flask App to Azure

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.ACR_NAME }}.azurecr.io/flaskapp:${{ github.sha }} .
          docker push ${{ secrets.ACR_NAME }}.azurecr.io/flaskapp:${{ github.sha }}

      # Professional Step: Handle Transitioning states
      - name: Wait for Transition and Stop
        run: |
          echo "Checking if container 'flaskapp' is busy..."
          # Wait up to 3 minutes for any ongoing operations to finish
          for i in {1..12}; do
            STATE=$(az container show --name flaskapp --resource-group ${{ secrets.RESOURCE_GROUP }} --query "provisioningState" --output tsv || echo "NotFound")
            if [[ "$STATE" != "Creating" && "$STATE" != "Updating" && "$STATE" != "Deleting" ]]; then
              echo "Container is stable. Stopping it now to prepare for update..."
              az container stop --name flaskapp --resource-group ${{ secrets.RESOURCE_GROUP }} || true
              exit 0
            fi
            echo "Container is currently $STATE. Retrying in 15 seconds (Attempt $i/12)..."
            sleep 15
          done
          echo "Timeout: Container group is stuck in transitioning." && exit 1

      - name: Deploy Container Instance
        run: |
          az container create \
            --resource-group ${{ secrets.RESOURCE_GROUP }} \
            --name flaskapp \
            --image ${{ secrets.ACR_NAME }}.azurecr.io/flaskapp:${{ github.sha }} \
            --registry-login-server ${{ secrets.ACR_NAME }}.azurecr.io \
            --registry-username ${{ secrets.ACR_USER }} \
            --registry-password ${{ secrets.ACR_PASS }} \
            --dns-name-label flaskapp-${{ github.run_number }} \
            --ports 5000 \
            --location southeastasia \
            --os-type Linux \
            --cpu 1 \
            --memory 1.5 \
            --environment-variables \
              MYSQL_HOST=${{ secrets.MYSQL_HOST }} \
              MYSQL_USER=${{ secrets.MYSQL_USER }} \
              MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }} \
              MYSQL_DB=${{ secrets.MYSQL_DB }}
